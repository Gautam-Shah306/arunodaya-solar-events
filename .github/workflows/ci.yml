name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: '1'
  FORCE_COLOR: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install exact npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run verification pipeline
        run: npm run verify

      - name: Upload Pages build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pages-dist
          path: apps/app/dist/pages
